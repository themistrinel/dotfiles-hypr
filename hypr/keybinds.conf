###################
### KEYBINDINGS ###
###################

# Set programs that you use
$terminal = foot
# $terminal = kitty
$wezterm = wezterm
$fileManager = thunar
$menu = wofi --show drun
$browser = zen-browser

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, W, togglefloating,
bind = $mainMod, space, exec, rofi -show drun
bind = $mainMod+ctrl, w, exec, waypaper

bind = $mainMod, P, exec, hyprpicker -a # color picker
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, C, exec, code
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, S, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/ocr.sh
bind = $mainMod, R, exec, ~/.config/hypr/scripts/screen-record.sh
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/screen-record.sh


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/workspace.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/workspace.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/workspace.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/workspace.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/workspace.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/workspace.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/workspace.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/workspace.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/workspace.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/workspace.sh 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# 
#/# bind = Super+Shift, ←/↑/→/↓,, # Window: move in direction
bind = $mainMod+Shift, Left, movewindow, l # [hidden]
bind = $mainMod+Shift, Right, movewindow, r # [hidden]
bind = $mainMod+Shift, Up, movewindow, u # [hidden]
bind = $mainMod+Shift, Down, movewindow, d # [hidden]

# Waybar theme toggle (fixed/pywal)
bind = $mainMod CTRL, T, exec, ~/.dotfiles/hypr/scripts/waybar-theme-toggle.sh toggle

# Pywal preset selector
bind = $mainMod, T, exec, ~/.dotfiles/hypr/scripts/wal-preset.sh

# Forçar reaplicação do tema automático (wallpaper + pywal + filtro)
bind = $mainMod SHIFT, A, exec, ~/.dotfiles/hypr/scripts/theme-auto.sh

# close and open Waybar / Zen Mode
bind = $mainMod, Escape, exec, ~/.config/hypr/scripts/zen-mode.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/reload.sh

# Apply GTK theme
bind = $mainMod CTRL, G, exec, ~/.config/hypr/scripts/apply-gtk-theme.sh

# Rofi keybindings
bind = $mainMod, V, exec, ~/.dotfiles/rofi/clipboard.sh
bind = $mainMod, Tab, exec, rofi -show window

# Audio recording
bind = $mainMod CTRL, R, exec, ~/.config/hypr/scripts/record-audio.sh

# Dotfiles Manager
bind = $mainMod SHIFT, D, exec, python3 ~/.dotfiles/dotfiles-manager/main.py