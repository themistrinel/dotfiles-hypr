[main]
font=JetBrainsMono Nerd Font:size=15
shell=fish
alpha=0.65

[colors-dark]
background=0f0f19
foreground=e0e0e8
regular0=0f0f19
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

[cursor]
style=beam

[key-bindings]
scrollback-up-page=Control+Shift+Page_Up
scrollback-down-page=Control+Shift+Page_Down

[mouse-bindings]
primary-paste=BTN_MIDDLE
