# i3status-rust config — ~/.dotfiles/i3status-rust/config.toml

[theme]
theme = "plain"

[theme.overrides]
idle_bg     = "#1e1e2e"
idle_fg     = "#cdd6f4"
good_bg     = "#1e1e2e"
good_fg     = "#a6e3a1"
warning_bg  = "#1e1e2e"
warning_fg  = "#fab387"
critical_bg = "#1e1e2e"
critical_fg = "#f38ba8"
separator   = "  "

[icons]
icons = "none"

[[block]]
block = "amd_gpu"
format = " GPU $utilization"
interval = 3

[[block]]
block = "cpu"
format = " CPU $utilization"
interval = 3

[[block]]
block = "memory"
format = " MEM $mem_used.eng(w:3,u:B,p:Gi)/$mem_total.eng(w:3,u:B,p:Gi)"
interval = 5

[[block]]
block = "disk_space"
path = "/"
format = " DISK $available"
interval = 20
warning = 20.0
alert = 10.0

[[block]]
block = "net"
device = "enp7s0"
format = " ↓$speed_down.eng(w:4,u:B,p:Mi) ↑$speed_up.eng(w:4,u:B,p:Mi)"
interval = 1

[[block]]
block = "time"
interval = 60
